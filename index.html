<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Let’s Together">
<meta name="theme-color" content="#100d12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="mark-180.png">
<link rel="icon" href="mark-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<title>Let’s Together: swipe, match, decide tonight</title>
<meta name="description" content="A swipe app for couples. Each of you swipes on movies, places to eat, events and trips, and Let’s Together shows what you both said yes to.">
<meta property="og:title" content="Let’s Together">
<meta property="og:description" content="Stop asking “what do you want to do?” Swipe separately, see what you both said yes to, decide tonight.">
<meta property="og:image" content="https://letstogether.app/mark-512.png">
<meta property="og:url" content="https://letstogether.app/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<style>
:root{
  --bg:#100d12; --surface:#1b171e; --surface2:#262029; --line:#342c38;
  --text:#f5efe8; --muted:#a39aa8; --accent:#ff6a4d; --accent-ink:#1c0b06;
  --gold:#ffc65c; --no:#8d8494; --ok:#59d39a;
  --serif:"Instrument Serif", "Iowan Old Style", Georgia, serif;
  --sans:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  --st:env(safe-area-inset-top, 0px); --sb:env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{position:fixed;inset:0;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3,p{margin:0}
#app{position:absolute;inset:0;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
.view{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--st) + 14px) 18px 24px}
.serif{font-family:var(--serif);font-weight:400;letter-spacing:.2px}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}

.home{flex:1;min-height:0;display:flex;flex-direction:column;padding:calc(var(--st) + 8px) 14px calc(var(--sb) + 10px)}
.home .row{gap:8px}
.ib{width:36px;height:36px;border-radius:50%;background:var(--surface);font-size:16px;display:grid;place-items:center;color:var(--text)}
.nudge.slim{padding:9px 12px;border-radius:14px;margin-top:8px;font-size:13.5px}
.nudge.slim b{font-size:17px;display:inline}.nudge.slim small{font-size:12.5px}.nudge.slim .go{padding:6px 12px;font-size:13px}
.done{overflow-y:auto;justify-content:flex-start}.done>:first-child{margin-top:auto}.done>:last-child{margin-bottom:auto}
/* tab bar */
.tabs{display:flex;border-top:1px solid var(--line);background:rgba(16,13,18,.94);padding-bottom:var(--sb)}
.tabs button{flex:1;padding:10px 0 9px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;letter-spacing:.3px}
.tabs button .ico{font-size:20px;filter:grayscale(1) opacity(.7)}
.tabs button.on{color:var(--text)} .tabs button.on .ico{filter:none}

/* home */
.brand{font-family:var(--serif);font-size:34px;line-height:1}
.brand i{color:var(--accent);font-style:italic}
.hello{font-family:var(--serif);font-size:30px;line-height:1.1;margin:22px 0 4px}
.sect{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid transparent;border-radius:18px;padding:16px 14px;text-align:left;min-height:104px;display:flex;flex-direction:column;justify-content:space-between}
.tile:active{transform:scale(.98)}
.tile .em{font-size:28px}
.tile b{font-family:var(--serif);font-weight:400;font-size:21px;display:block}
.tile small{color:var(--muted);font-size:12px}
.tile.wide{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;gap:12px;justify-content:flex-start}
.nudge{background:linear-gradient(135deg,#ff6a4d,#e23d6e);color:#fff;border-radius:20px;padding:16px;margin-top:14px;display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.nudge .em{font-size:30px}
.nudge b{font-family:var(--serif);font-weight:400;font-size:22px;display:block;line-height:1.15}
.nudge small{opacity:.9;font-size:13px}
.nudge .go{margin-left:auto;background:#fff;color:#c2274a;border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.sess{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.sess .em{width:42px;height:42px;border-radius:12px;background:var(--surface);display:grid;place-items:center;font-size:20px;flex:none}
.sess b{font-weight:600;font-size:15px;display:block}
.sess small{color:var(--muted);font-size:12.5px}
.pill{border-radius:999px;padding:5px 10px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--text);white-space:nowrap}
.pill.hot{background:var(--accent);color:var(--accent-ink)}
.note{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:14px;font-size:14px;color:var(--muted);margin-top:14px;line-height:1.45}
.note b{color:var(--text)}

/* buttons / forms */
.btn{background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:14px;padding:14px 18px;width:100%;font-size:16px}
.btn:disabled{opacity:.5}
.btn.ghost{background:var(--surface2);color:var(--text);font-weight:600}
.btn.sm{width:auto;padding:9px 14px;font-size:14px;border-radius:12px}
.field{display:block;margin-top:12px}
.field span{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;letter-spacing:.3px}
.field input,.field select,.field textarea{width:100%;background:var(--surface);border:1px solid transparent;border-radius:12px;padding:12px;font-size:16px;outline:none}
.field textarea{min-height:150px;resize:vertical;line-height:1.4}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid transparent;background:var(--surface);border-radius:999px;padding:8px 13px;font-size:14px;color:var(--muted)}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600}
.seg{display:flex;background:var(--surface);border-radius:12px;padding:3px;margin:14px 0;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.seg button{flex:1;padding:9px 2px;border-radius:10px;font-size:12.5px;color:var(--muted)}
.seg button.on{background:var(--surface2);color:var(--text);font-weight:600}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.item .em{font-size:22px;width:30px;text-align:center;flex:none}
.item b{font-weight:600;font-size:15px;display:block}
.item small{color:var(--muted);font-size:12.5px;display:block}
.item .x{color:var(--muted);font-size:20px;padding:6px 8px}

/* swipe */
.swipe{flex:1;min-height:0;display:flex;flex-direction:column;padding:calc(var(--st) + 8px) 14px calc(var(--sb) + 10px)}
.topbar{display:flex;align-items:center;gap:10px;min-height:44px}
.topbar .back{font-size:26px;width:40px;height:40px;border-radius:50%;background:var(--surface);line-height:1}
.topbar h2{font-family:var(--serif);font-weight:400;font-size:24px;line-height:1}
.topbar small{color:var(--muted);font-size:12px;display:block;margin-top:3px}
.stack{flex:1;min-height:0;position:relative;margin:10px 0 12px}
.card{position:absolute;inset:0;border-radius:26px;overflow:hidden;background:var(--surface);box-shadow:0 18px 40px rgba(0,0,0,.5);
  touch-action:none;user-select:none;-webkit-user-select:none;will-change:transform}
.card.under{pointer-events:none}
.card img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.card .art{position:absolute;inset:0;display:grid;place-items:center;font-size:110px;padding-bottom:22%}
.art.activity{background:radial-gradient(120% 90% at 20% 10%,#5b2a86,#1b1030 70%)}
.art.dinner{background:radial-gradient(120% 90% at 80% 10%,#a8431f,#2a1209 70%)}
.art.event{background:radial-gradient(120% 90% at 20% 10%,#12697a,#0a1f2b 70%)}
.art.movie{background:radial-gradient(120% 90% at 50% 10%,#3b3140,#141016 70%)}
.card .shade{position:absolute;inset:auto 0 0 0;padding:90px 20px 20px;background:linear-gradient(transparent,rgba(8,6,10,.82) 45%,rgba(8,6,10,.96))}
.card h3{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.02}
.card .sub{color:#e6dde2;font-size:14.5px;margin-top:6px;line-height:1.35}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:11.5px;font-weight:600;border-radius:999px;padding:4px 9px;background:rgba(38,30,40,.78)}
.tag.svc::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--dot,#fff);margin-right:6px}
.info{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.45);font-family:var(--serif);font-style:italic;font-size:20px;display:grid;place-items:center;pointer-events:none}
.stamp{position:absolute;top:26px;font-family:var(--serif);font-size:40px;padding:2px 14px;border:3px solid;border-radius:12px;opacity:0;pointer-events:none;background:rgba(0,0,0,.25)}
.stamp.yes{left:20px;color:var(--ok);transform:rotate(-12deg)}
.stamp.no{right:20px;color:#ff8a8a;transform:rotate(12deg)}
.stamp.love{left:50%;top:auto;bottom:38%;color:var(--gold);transform:translateX(-50%)}
.stamp.seen{left:50%;top:30%;color:#d9d2dc;transform:translateX(-50%);white-space:nowrap}
.actions{display:flex;justify-content:center;align-items:center;gap:14px}
.act{width:58px;height:58px;border-radius:50%;background:var(--surface);border:1px solid transparent;font-size:24px;display:grid;place-items:center}
.act:active{transform:scale(.92)}
.act.sm{width:46px;height:46px;font-size:18px}
.act.yes{background:var(--accent);border-color:var(--accent);width:66px;height:66px;font-size:28px}
.act.love{color:var(--gold)} .act.no{color:#ff9d9d}
.act small{font-size:9px;display:block;margin-top:-4px;color:var(--muted);letter-spacing:.5px}
.done{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:20px}
.done h3{font-family:var(--serif);font-weight:400;font-size:32px}
.done .btn{max-width:300px}

/* sheets and overlays */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:92dvh;overflow-y:auto;border-radius:26px 26px 0 0;padding:10px 18px calc(var(--sb) + 20px);animation:up .24s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.05}
.sheet .field input,.sheet .field select,.sheet .field textarea,.sheet .chip{background:var(--bg)}
.sheet .chip.on{background:var(--text)}
.hero{margin:-10px -18px 14px;height:240px;position:relative;background:var(--surface2)}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,var(--surface))}
.hero .close{position:absolute;right:12px;top:12px;z-index:2;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.55);font-size:20px}
.body p{font-size:15px;line-height:1.5;color:#e4dbe0;margin-top:12px}
.kv{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
.cast{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:14px}
.cast span{display:block;color:var(--muted);font-size:12px}
.match{position:fixed;inset:0;z-index:30;background:radial-gradient(120% 80% at 50% 0%,#e23d6e,#3a0f24 60%,#100d12);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 26px calc(var(--sb) + 26px);gap:14px;animation:fade .2s}
.match h1{font-family:var(--serif);font-weight:400;font-style:italic;font-size:54px;line-height:.95}
.match .pic{width:170px;height:240px;border-radius:20px;overflow:hidden;background:var(--surface);box-shadow:0 20px 50px rgba(0,0,0,.5);display:grid;place-items:center;font-size:80px;transform:rotate(-3deg);animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
.match .pic img{width:100%;height:100%;object-fit:cover}
.match h3{font-family:var(--serif);font-weight:400;font-size:28px}
.match .btn{max-width:320px}
.toast{position:fixed;left:50%;top:calc(var(--st) + 12px);transform:translateX(-50%);z-index:40;background:var(--text);color:var(--bg);border-radius:14px;padding:11px 16px;font-size:14px;font-weight:600;max-width:88%;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:drop .25s}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;padding:30px 26px calc(var(--sb) + 30px)}
/* polish */
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.14em}
body::before{content:"";position:fixed;inset:-20% -10% auto -10%;height:60%;background:radial-gradient(60% 60% at 30% 20%,rgba(255,106,77,.13),transparent 70%),radial-gradient(50% 50% at 85% 10%,rgba(226,61,110,.12),transparent 70%);pointer-events:none;z-index:0}
#app,#layer{position:absolute;z-index:1}#layer{position:static}
.brand i{background:linear-gradient(100deg,#ff6a4d 20%,#ffd0a8 45%,#ff5c8a 70%,#ff6a4d 95%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 12.0s linear infinite}
.btn{position:relative;overflow:hidden;background:linear-gradient(135deg,#ff7a4d,#ff4d7e);color:#fff;letter-spacing:.2px;border-radius:16px;
  box-shadow:0 8px 24px -8px rgba(255,90,100,.65), inset 0 -2px 0 rgba(0,0,0,.12);transition:transform .12s}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.28) 50%,transparent 65%);transform:translateX(-120%);animation:sweep 10.8s ease-in-out infinite}
.btn:active{transform:scale(.975)}
.btn.ghost{background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03));color:var(--text);box-shadow:none}
.btn.ghost::after{display:none}
.btn.sm{border-radius:12px}
.chip{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid transparent;color:#d9d0dc;font-weight:500;transition:all .15s}
.chip.on,.sheet .chip.on{background:linear-gradient(135deg,#ff7a4d,#ff4d7e);border-color:transparent;color:#fff;font-weight:600;box-shadow:0 6px 18px -6px rgba(255,90,100,.7)}
.seg{background:rgba(255,255,255,.05);box-shadow:none;border-radius:14px}
.seg button{border-radius:11px;font-weight:500;transition:all .15s}
.seg button.on{background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.07));box-shadow:0 4px 14px -6px rgba(255,106,77,.6)}
.pill.hot{background:linear-gradient(135deg,#ff7a4d,#ff4d7e);color:#fff;box-shadow:0 0 18px -2px rgba(255,90,100,.7)}
.ib{background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.04));box-shadow:none;font-size:18px}
.card{box-shadow:0 18px 40px rgba(0,0,0,.55), 0 0 60px -20px rgba(255,90,100,.35)}
.card .art{animation:bob 3.6s ease-in-out infinite}
.act{background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.03));border:0;box-shadow:0 8px 20px -10px rgba(0,0,0,.8);font-size:24px;color:#d9d0dc}
.act.sm{font-size:19px}
.act.no{color:#ff9a9a;box-shadow:0 0 22px -8px rgba(255,120,120,.6)}
.act.love{color:var(--gold);box-shadow:0 0 22px -8px rgba(255,198,92,.7)}
.act.yes{background:linear-gradient(135deg,#ff7a4d,#ff4d7e);color:#fff;font-size:29px;box-shadow:0 10px 28px -8px rgba(255,90,100,.8);animation:pulse 2.8s ease-in-out infinite}
.tile{background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02))!important;border:0;box-shadow:none}
.tic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:22px;color:#fff;flex:none;background:linear-gradient(135deg,#ff7a4d,#ff4d7e);box-shadow:0 8px 20px -8px rgba(255,90,100,.8)}
.sess .tic{width:40px;height:40px;font-size:19px;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.04));box-shadow:none;color:#ffb39c}
.badge{width:84px;height:84px;border-radius:28px;display:grid;place-items:center;font-size:40px;color:#fff;background:linear-gradient(135deg,#ff7a4d,#ff4d7e);box-shadow:0 0 50px -6px rgba(255,90,100,.8)}
.nudge{box-shadow:0 10px 30px -12px rgba(226,61,110,.8)}
.sheet{background:linear-gradient(180deg,#221c26,#1a161d);box-shadow:0 -1px 0 rgba(255,255,255,.1), 0 -30px 80px -20px rgba(0,0,0,.8)}
.field input:focus,.field textarea:focus,.field select:focus{box-shadow:none}
.steps{display:flex;flex-direction:column;gap:12px;margin:18px 0}
.step{display:flex;align-items:center;gap:12px;font-size:15.5px;line-height:1.35}
.step .num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:700;font-size:14px;color:#fff;background:linear-gradient(135deg,#ff7a4d,#ff4d7e);box-shadow:0 0 16px -4px rgba(255,90,100,.8)}
.cele{position:fixed;left:50%;top:calc(var(--st) + 14px);transform:translateX(-50%);z-index:45;display:flex;align-items:center;gap:10px;padding:10px 16px 10px 10px;border-radius:999px;max-width:90%;
  background:linear-gradient(135deg,#ff7a4d,#ff4d7e);color:#fff;box-shadow:0 0 44px -4px rgba(255,90,100,.9);animation:celein .45s cubic-bezier(.2,1.5,.4,1),celeout .35s 2.3s forwards}
.cele .hb{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:18px;animation:beat .6s ease-in-out 3}
.cele b{display:block;font-family:var(--serif);font-weight:400;font-size:19px;line-height:1.1}.cele small{font-size:12.5px;opacity:.95;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.cele i{position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:2px;background:var(--c,#ffd0a8);opacity:0;animation:pop2 .9s .1s ease-out forwards}
.mrow{display:flex;gap:10px;overflow-x:auto;width:100%;padding:6px 2px 10px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.mrow.one{justify-content:center}
.mcard{flex:0 0 156px;scroll-snap-align:center;border-radius:18px;padding:8px;display:flex;flex-direction:column;gap:7px;text-align:left;background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.03));box-shadow:0 0 30px -12px rgba(255,90,100,.7)}
.mrow.one .mcard{flex-basis:200px}
.mcard .mimg{height:190px;border-radius:12px;overflow:hidden;background:var(--surface2);display:grid;place-items:center;font-size:56px;width:100%}
.mrow.one .mimg{height:240px}
.mcard .mimg img{width:100%;height:100%;object-fit:cover}
.mcard b{font-family:var(--serif);font-weight:400;font-size:18px;line-height:1.1}
.mcard small{font-size:12px;line-height:1.3;color:#e6d6dc;font-style:italic}
.tn-head{text-align:center;padding:4px 0 2px}
.tn-head .brand{font-size:15px;opacity:.85;letter-spacing:.3px}
.tn-head h2{font-family:var(--serif);font-style:italic;font-weight:400;font-size:34px;line-height:1.05;margin-top:6px;background:linear-gradient(100deg,#ffd0a8 15%,#fff 40%,#ff8fb0 62%,#ffd0a8 88%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 12.0s linear infinite}

/* Category likes (option B): a small glowing dot on tabs that have shared likes; the tab you're on shows the count. */
.seg button{position:relative;overflow:visible}
.seg .hc{font-size:0;padding:0;top:4px;right:7px;bottom:auto;width:6px;height:6px;border-radius:50%;background:#ff5c8a;box-shadow:0 0 6px rgba(255,92,138,.8);transition:all .2s}
.seg button.on .hc{font-size:9.5px;width:auto;height:auto;border-radius:99px;padding:0 5px;top:-7px;right:-2px;line-height:15px;background:linear-gradient(135deg,#ff7a4d,#ff4d7e)}


/* the note over a freshly dealt pile */
.revnote{position:absolute;left:50%;top:-12px;z-index:30;transform:translateX(-50%);white-space:nowrap;pointer-events:none;padding:6px 14px;border-radius:99px;font-size:13px;font-weight:600;color:#fff;background:linear-gradient(135deg,#ff7a4d,#ff4d7e);box-shadow:0 0 24px rgba(255,77,126,.7)}
/* tonight: a loose pile of five */
.tdeck{position:relative;width:min(250px,68vw);aspect-ratio:250/330;margin:30px auto 22px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.tpc{position:absolute;inset:0;border-radius:28px;overflow:hidden;color:#fff;background:linear-gradient(155deg,var(--c1),var(--c2));will-change:transform}
.tpc .cbg{position:absolute;right:-26px;bottom:-24px;font-size:170px;opacity:.16;transform:rotate(-12deg);line-height:1}
.tpc .cic{position:absolute;left:16px;top:16px;width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-size:26px;background:rgba(255,255,255,.22)}
.tpc .cnum{position:absolute;right:16px;top:20px;font-size:12px;font-weight:700;background:rgba(0,0,0,.22);padding:4px 9px;border-radius:99px}
.tpc .ctx{position:absolute;left:18px;right:16px;bottom:18px}.tpc .ctx b{display:block;font-family:var(--serif);font-weight:400;font-size:32px;line-height:1.05}.tpc .ctx small{display:block;font-size:13.5px;line-height:1.3;opacity:.92;margin-top:6px}
.tdots{display:flex;justify-content:center;gap:7px;margin:14px 0 6px}.tdots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.2);transition:background .3s,transform .3s}.tdots i.on{background:#ff8a6a;transform:scale(1.3)}
/* a plan opened from a banner or the inbox arrives in its own color: a burst, a rim that settles, and each stop lighting in turn */
.scrim.kglow::before{content:"";position:fixed;left:50%;top:22%;width:60px;height:60px;margin:-30px;border-radius:50%;background:radial-gradient(circle,var(--kb),transparent 70%);filter:blur(6px);pointer-events:none;animation:kbloom .9s ease-out calc(0s - var(--ke,0s)) both}
@keyframes kbloom{0%{opacity:0;transform:scale(1)}40%{opacity:.85;transform:scale(9)}100%{opacity:0;transform:scale(16)}}
.scrim.kglow .sheet{animation:pop .22s cubic-bezier(.2,.9,.3,1),kglow 1.6s ease-out calc(.1s - var(--ke,0s)) forwards}
@keyframes kglow{0%{box-shadow:0 0 0 0 transparent}35%{box-shadow:0 0 70px 8px var(--kg)}100%{box-shadow:0 0 36px -8px var(--kg)}}
.scrim.kset .sheet{box-shadow:0 0 36px -8px var(--kg)}
.scrim.kglow .prow{border-radius:14px;animation:kpulse .9s ease-out both;animation-delay:calc(.35s + var(--i,0) * .11s - var(--ke,0s))}
@keyframes kpulse{0%{opacity:0;transform:translateY(12px)}40%{opacity:1;transform:none;box-shadow:0 0 22px -2px var(--kg)}100%{box-shadow:0 0 0 0 transparent}}

/* ---- one palette: categories wear the five colors; glows, not edges; line icons, no tiles ---- */
.seg button.kc .hc{background:linear-gradient(135deg,var(--ka),var(--kb));box-shadow:0 0 6px var(--kb)}
.seg button.kc.on{background:linear-gradient(135deg,color-mix(in srgb,var(--ka) 26%,transparent),color-mix(in srgb,var(--kb) 14%,transparent));box-shadow:0 0 16px -2px var(--kg)}
.seg button.kc.on .hc{background:linear-gradient(135deg,var(--ka),var(--kb))}
.stack.kc .card:not(.under){box-shadow:0 18px 40px rgba(0,0,0,.55),0 0 56px -16px var(--kg)}
.tripbar .tic,.inrow .tic,.tripbar.kc .tic,.inrow.kc .tic{background:none!important;box-shadow:none!important;width:30px;color:var(--ka,#ff9a7a);filter:drop-shadow(0 0 7px var(--kb,#ff4d7e))}
.tripbar .tic .ic,.inrow .tic .ic{width:24px;height:24px}
.tripbar.kc{box-shadow:0 10px 34px -12px var(--kg)}
.inrow.kc{background:linear-gradient(135deg,var(--kt2),transparent 78%);box-shadow:0 8px 26px -14px var(--kg);margin-bottom:6px}
.tpc.kc{background:linear-gradient(160deg,color-mix(in srgb,var(--ka) 24%,#21161b),#1a1115 62%)}
.tpc .cic{background:none;color:var(--ka,#fff);filter:drop-shadow(0 0 9px var(--kb,#fff));width:40px;height:40px}
.tpc .cic .ic{width:34px;height:34px}
.tpc .cbg{color:var(--ka,#fff);opacity:.1}
.tpc .ctx,.tpc .cic{z-index:3}
.tpc.mixc{background:#7a5cff}
.tpc.mixc .cic{color:#fff;filter:drop-shadow(0 0 8px rgba(255,255,255,.9))}
.tpc .ink{position:absolute;inset:-35%;background:linear-gradient(135deg,#b04dff,#ff4d7e 35%,#ffb547 60%,#2dd4bf 85%,#4d9bff)}
.tpc .ink i{position:absolute;width:72%;height:72%;border-radius:50%}
/* neighbours on the wheel sit next to each other, so every blend stays bright (no gold over violet) */
.tpc .ink i:nth-child(1){background:radial-gradient(circle,#8a5cff 0,#8a5cff00 68%);left:-6%;top:-4%;animation:ik1 11s ease-in-out infinite alternate}
.tpc .ink i:nth-child(2){background:radial-gradient(circle,#ff4d9e 0,#ff4d9e00 68%);right:-8%;top:4%;animation:ik2 13s ease-in-out infinite alternate}
.tpc .ink i:nth-child(3){background:radial-gradient(circle,#ff8a4d 0,#ff8a4d00 68%);right:-4%;top:34%;animation:ik3 12s ease-in-out infinite alternate}
.tpc .ink i:nth-child(4){background:radial-gradient(circle,#ffc94d 0,#ffc94d00 68%);right:4%;bottom:-6%;animation:ik4 14s ease-in-out infinite alternate}
.tpc .ink i:nth-child(5){background:radial-gradient(circle,#2dd4bf 0,#2dd4bf00 68%);left:-4%;bottom:-4%;animation:ik5 10s ease-in-out infinite alternate}
.tpc .ink i:nth-child(6){background:radial-gradient(circle,#4d9bff 0,#4d9bff00 68%);left:-10%;top:30%;animation:ik6 15s ease-in-out infinite alternate}
@keyframes ik1{to{transform:translate(30%,12%) scale(1.15)}}@keyframes ik2{to{transform:translate(-26%,22%) scale(.9)}}@keyframes ik3{to{transform:translate(-14%,-26%) scale(1.12)}}
@keyframes ik4{to{transform:translate(-28%,-14%) scale(1.15)}}@keyframes ik5{to{transform:translate(24%,-18%) scale(.9)}}@keyframes ik6{to{transform:translate(14%,28%) scale(1.1)}}
.tpc .veil{position:absolute;inset:0;z-index:2;background:linear-gradient(180deg,transparent 45%,rgba(10,6,10,.45))}
.thalo{position:absolute;inset:-26px;border-radius:50px;z-index:0;pointer-events:none;background:conic-gradient(#8a5cff,#ff4d9e,#ff8a4d,#ffc94d,#2dd4bf,#4d9bff,#8a5cff);filter:blur(38px);opacity:0;transition:opacity .5s;animation:tspin 16s linear infinite}
.thalo.show{opacity:.6}
@keyframes tspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.tpc .ink i,.thalo{animation:none}}

/* ---- tilt: satin gloss on the top card, like a new playing card ---- */
.gls{position:absolute;inset:0;overflow:hidden;border-radius:inherit;pointer-events:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.gls i{position:absolute;left:-60%;top:-40%;width:220%;height:180%}
.gls i:nth-child(1){background:radial-gradient(38% 16% at 44% 40%,rgba(255,255,255,.12),transparent 72%),radial-gradient(30% 22% at 57% 58%,rgba(255,255,255,.085),transparent 72%),radial-gradient(22% 12% at 49% 74%,rgba(255,255,255,.055),transparent 72%),radial-gradient(16% 20% at 38% 55%,rgba(255,255,255,.04),transparent 72%);transform:translate(calc(var(--tx,0)*22%),calc(var(--ty,0)*14%)) rotate(calc(-6deg + var(--tx,0)*4deg))}
.gls i:nth-child(2){background:radial-gradient(26% 14% at 60% 34%,rgba(255,255,255,.06),transparent 72%),radial-gradient(34% 12% at 40% 66%,rgba(255,255,255,.05),transparent 72%);transform:translate(calc(var(--tx,0)*31%),calc(var(--ty,0)*21%)) rotate(calc(8deg - var(--ty,0)*5deg))}
.gls i:nth-child(3){display:none}
.tpc .lava{position:absolute;inset:0;width:100%;height:100%}
.tpc.mixc{background:linear-gradient(160deg,#6a48e0,#b83fa8 55%,#e0556a);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.tpc.mixc .veil{background:radial-gradient(120% 80% at 30% 10%,rgba(255,255,255,.16),transparent 55%),linear-gradient(180deg,transparent 45%,rgba(10,6,10,.5))}

/* ---- plan a surprise ---- */
.tpc.goldc{background:linear-gradient(135deg,#8a5f16,#b0842a 30%,#c29a3c 50%,#a87c24 72%,#94691c);--kg:rgba(255,190,70,.6);color:#3a2404;box-shadow:inset 0 1px 0 rgba(255,245,210,.7),inset 0 -2px 4px rgba(80,45,0,.5)}
.tpc.goldc::after{content:"";position:absolute;inset:9px;border-radius:20px;box-shadow:inset 0 0 0 1px rgba(255,244,205,.55),0 0 0 1px rgba(90,55,5,.3);pointer-events:none}
.tpc.goldc .glit{position:absolute;inset:0;width:100%;height:100%}
.tpc.goldc .ctx{color:#3a2404;text-shadow:0 1px 0 rgba(255,246,210,.6)}.tpc.goldc .ctx small{color:#4f3408;opacity:1;font-weight:500}
.tpc.goldc .cnum{left:20px;right:auto;top:22px;color:#4a2f06;background:rgba(255,248,220,.5)}
.gls.gold{box-shadow:none;mix-blend-mode:soft-light;opacity:.75}
.gls.gold i:nth-child(1){background:radial-gradient(38% 16% at 44% 40%,rgba(255,255,255,.75),transparent 72%),radial-gradient(30% 22% at 57% 58%,rgba(255,255,255,.5),transparent 72%),radial-gradient(22% 12% at 49% 74%,rgba(255,255,255,.35),transparent 72%)}
.gls.gold i:nth-child(2){background:radial-gradient(26% 14% at 60% 34%,rgba(255,255,255,.45),transparent 72%),radial-gradient(34% 12% at 40% 66%,rgba(255,250,230,.4),transparent 72%)}
.gls.gold i:nth-child(3){display:none}
.surp h2{font-family:var(--serif);font-weight:400;font-size:28px;line-height:1.1}
.surp .skick{display:block;letter-spacing:1.5px;text-transform:uppercase;font-size:11.5px;color:#ffd27a;margin-bottom:6px}
.sprog{display:flex;gap:5px;margin:2px 0 14px}.sprog i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.11)}.sprog i.on{background:linear-gradient(90deg,#ffd27a,#ff8fb0)}
.stiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.stile{border-radius:20px;padding:14px;height:118px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;background:linear-gradient(150deg,color-mix(in srgb,var(--ka) 20%,#21161b),#1a1115 70%);box-shadow:0 8px 26px -14px var(--kg)}
.stile .tic{background:none!important;box-shadow:none!important;width:auto;height:auto;justify-self:start;color:var(--ka);filter:drop-shadow(0 0 7px var(--kb));font-size:24px;display:block}
.stile b{display:block;font-size:15px}.stile small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.sopt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px;border-radius:18px;background:rgba(255,255,255,.04);margin-bottom:8px}
.sopt img,.sopt .pimg{flex:none;width:62px;height:62px;border-radius:13px;object-fit:cover;background:var(--surface2);display:grid;place-items:center;font-size:22px}
.sopt b{display:block;font-size:14.5px;line-height:1.25}.sopt small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.sopt.on{background:linear-gradient(135deg,rgba(255,210,122,.18),rgba(255,255,255,.04) 70%);box-shadow:0 8px 26px -12px rgba(255,180,60,.8)}
.stags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.stags i{font-style:normal;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.08);color:#cdbfc4}
.stags i.her{background:rgba(255,77,126,.18);color:#ff9ab6}.stags i.bk{background:rgba(45,212,191,.16);color:#7fe6d6}
.sch{margin-top:12px}
.scount{display:flex;gap:8px;margin-top:14px}.scount div{flex:1;text-align:center;padding:9px 0;border-radius:14px;background:rgba(255,255,255,.05)}.scount b{display:block;font-family:var(--serif);font-weight:400;font-size:24px}.scount small{font-size:11px;color:var(--muted)}
.scr.gold .scr-card{box-shadow:0 26px 60px -16px rgba(0,0,0,.9),0 0 70px -10px rgba(255,200,90,.8)}
.scr.gold h2{font-family:var(--serif);font-weight:400;font-size:28px}
/* inbox rows: the pulse is a glow, the row itself stays light */
.inrow.kc.p1,.inrow.kc.p2{animation:rowk2 2.4s ease-in-out infinite}.inrow.kc.p3{animation:rowk2 1.2s ease-in-out infinite}
@keyframes rowk2{0%,100%{box-shadow:0 8px 26px -14px var(--kg)}50%{box-shadow:0 8px 30px -7px var(--kg)}}

/* tabs switch at once: no slow morph of the likes chip */
.seg .hc{transition:none}.seg button{transition:background .12s,color .12s}

.tpc .whl{position:absolute;left:50%;top:50%;width:176%;aspect-ratio:1;margin:-88% 0 0 -88%;border-radius:50%;will-change:transform;background:conic-gradient(#8a5cff 0 60deg,#ff4d9e 60deg 120deg,#ff8a4d 120deg 180deg,#ffc94d 180deg 240deg,#2dd4bf 240deg 300deg,#4d9bff 300deg 360deg)}
.tpc.mixc .veil{background:linear-gradient(180deg,transparent 55%,rgba(16,10,13,.55))}
.tpc.mixc .ctx{text-shadow:0 2px 10px rgba(0,0,0,.6)}.tpc.mixc .ctx small{color:#fff;opacity:1}
.tpc.mixc .cbg{display:none}

/* iPhone can forget a card's rounded corners for layers that move inside it, so each moving layer is clipped round itself */
.gls{clip-path:inset(0 round 26px)}
.tpc .gls{clip-path:inset(0 round 28px)}
.tpc .wbx{position:absolute;inset:0;border-radius:28px;overflow:hidden;clip-path:inset(0 round 28px)}
.tpc .veil{border-radius:28px}

/* gloss, take 3: the light is the layer's own background, sliding inside a layer that is exactly the card's shape.
   Nothing sticks out of the card, so there is nothing for the phone to forget to trim: corners stay round. */
.gls{clip-path:none;overflow:visible;inset:0;border-radius:inherit;background-repeat:no-repeat;background-size:220% 180%,220% 180%;
  background-image:radial-gradient(38% 16% at 44% 40%,rgba(255,255,255,.12),transparent 72%),radial-gradient(30% 22% at 57% 58%,rgba(255,255,255,.085),transparent 72%);
  background-position:calc(50% - var(--tx,0)*34%) calc(50% - var(--ty,0)*24%),calc(50% - var(--tx,0)*52%) calc(50% - var(--ty,0)*38%)}
.gls.gold{mix-blend-mode:normal;opacity:1;clip-path:none;
  background-image:radial-gradient(38% 16% at 44% 40%,rgba(255,250,225,.34),transparent 72%),radial-gradient(30% 22% at 57% 58%,rgba(255,250,225,.22),transparent 72%)}
.tpc .gls{clip-path:none}

/* the gold card is tied with a velvet band and a big bow */
.tpc .gband{position:absolute;left:0;right:0;top:34.3%;height:12.6%;background:linear-gradient(180deg,#c9566e,#8e1f3a 40%,#560f22);box-shadow:0 4px 10px rgba(40,10,0,.5),inset 0 2px 0 rgba(255,220,160,.55),inset 0 -2px 0 rgba(255,220,160,.45);pointer-events:none}
.tpc .gbow{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;filter:drop-shadow(0 5px 6px rgba(60,30,0,.5))}
.tpc.goldc .ctx,.tpc.goldc .cnum{z-index:3}

/* the logo's glow follows its rounded shape (a plain shadow on the drawing came out square on iPhone) */

/* a little separation under the top card of every pile */

.dock button{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;border-radius:19px;font-size:11.5px;font-weight:600;color:#d6c8ce;white-space:nowrap}

.trp .tcity{margin-top:14px}.trp .tcity .tcard.pa{flex:0 0 min(38vw,150px);aspect-ratio:4/5;box-shadow:0 12px 26px -14px #000,0 0 24px -8px var(--kg)}

.tring{flex:none;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--ka) 0 var(--p),rgba(255,255,255,.1) 0)}

/* trip consensus: agree, claim, then book */

/* a hidden gem reaching the top of a pile: the card catches light in cut-gem facets, once */
.gfx{position:absolute;inset:0;pointer-events:none;border-radius:inherit;overflow:hidden;z-index:1}.gfx i{position:absolute;inset:0;opacity:0}
.gfx i:nth-child(1){clip-path:polygon(0 0,58% 0,22% 42%);background:rgba(255,255,255,.3)}.gfx i:nth-child(2){clip-path:polygon(58% 0,100% 0,100% 38%,22% 42%);background:rgba(255,190,210,.28)}
.gfx i:nth-child(3){clip-path:polygon(0 0,22% 42%,0 78%);background:rgba(160,240,225,.26)}.gfx i:nth-child(4){clip-path:polygon(22% 42%,100% 38%,64% 100%,0 78%);background:rgba(255,255,255,.2)}.gfx i:nth-child(5){clip-path:polygon(100% 38%,100% 100%,64% 100%);background:rgba(255,190,210,.24)}
@keyframes gfacet{0%{opacity:0}28%{opacity:1}100%{opacity:0}}@keyframes gpop{0%{transform:scale(1)}35%{transform:scale(1.7) rotate(-8deg)}70%{transform:scale(.92)}100%{transform:scale(1)}}@keyframes gstar{0%{opacity:0;transform:scale(.2)}45%{opacity:1;transform:scale(1.2) rotate(40deg)}100%{opacity:0;transform:scale(.3) rotate(90deg)}}
.card.gemc.tl .gfx i{animation:gfacet .6s ease-out both}.card.gemc.tl .gfx i:nth-child(1){animation-delay:.3s}.card.gemc.tl .gfx i:nth-child(2){animation-delay:.43s}.card.gemc.tl .gfx i:nth-child(3){animation-delay:.56s}.card.gemc.tl .gfx i:nth-child(4){animation-delay:.69s}.card.gemc.tl .gfx i:nth-child(5){animation-delay:.82s}
.gemk{position:relative}.gst{position:absolute;left:-4px;top:-16px;width:14px;height:14px;background:#fff;opacity:0;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%)}.gst+.gst{left:20px;top:-26px;width:9px;height:9px}
.card.gemc.tl .gemk .ic{animation:gpop .6s .45s both}.card.gemc.tl .gst{animation:gstar .7s 1s both}.card.gemc.tl .gst+.gst{animation-delay:1.25s}
@media (prefers-reduced-motion:reduce){.card.gemc.tl .gfx i,.card.gemc.tl .gemk .ic,.card.gemc.tl .gst{animation:none}}

.gemhall .tc-h b{display:flex;align-items:center;gap:7px}.gemhall .tc-h b .ic{width:17px;height:17px;color:#ffd6e0;filter:drop-shadow(0 0 5px rgba(255,77,126,.9))}
.gemhall img{clip-path:polygon(13% 0,100% 0,100% 87%,87% 100%,0 100%,0 13%)}

.tag.loc{background:rgba(45,212,191,.2);color:#bff5ec}

.stamp.seen.long{font-size:clamp(30px,10.5vw,52px)}

/* what's new walkthrough */
.wk .wk-in{width:min(92vw,400px);min-height:min(78vh,620px);display:flex;flex-direction:column;border-radius:30px;background:#130c10;padding:18px 18px 16px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.wk-dots{display:flex;gap:5px}.wk-dots i{width:20px;height:4px;border-radius:4px;background:rgba(255,255,255,.14)}.wk-dots i.on{background:var(--ka)}
.wk-k{display:block;margin-top:14px;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--ka)}.wk-h{font-family:var(--serif);font-weight:400;font-size:28px;line-height:1.12;margin:4px 0 6px}.wk-p{font-size:14px;line-height:1.45;color:#cbbfc4}
.wk-stage{flex:1;position:relative;margin:14px 0 12px;min-height:250px}
.wk-cta{background:linear-gradient(135deg,var(--ka),var(--kb));color:#1c0a12}.wk-cta.wait{background:rgba(255,255,255,.07);color:var(--muted);box-shadow:none}
.wk-card{position:absolute;left:50%;top:4px;width:150px;height:200px;margin-left:-75px;border-radius:18px;background:radial-gradient(90% 60% at 50% 30%,#7a4a8f,#2a1638 60%,#140a1c);box-shadow:0 14px 30px rgba(0,0,0,.7),0 0 40px -8px var(--kb);touch-action:none;display:grid;place-items:center}
.wk-stamp{font-family:var(--serif);font-size:24px;border:3px solid #ffd27a;color:#ffd27a;border-radius:10px;padding:2px 10px;background:rgba(0,0,0,.4);white-space:nowrap;opacity:0;transform:rotate(-8deg)}.wk-stamp.pop{animation:wkpop .9s both}
@keyframes wkpop{0%{opacity:0;transform:rotate(-8deg) scale(.5)}25%{opacity:1;transform:rotate(-8deg) scale(1.15)}40%{transform:rotate(-8deg) scale(1)}80%{opacity:1}100%{opacity:0}}
.wk-dirs{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.wk-dirs div{border-radius:12px;padding:8px 2px;text-align:center;font-size:11px;background:rgba(255,255,255,.06);color:var(--muted);transition:background .2s,color .2s}.wk-dirs b{display:block;font-size:15px}.wk-dirs .on{background:rgba(255,181,71,.18);color:#ffe2b0}.wk-dirs .on b{color:var(--ka)}
.wk-gem{position:absolute;left:50%;top:0;width:180px;height:232px;margin-left:-90px;border-radius:18px;overflow:hidden;background:radial-gradient(90% 60% at 50% 30%,#3d8f86,#16454a 55%,#0c2226);box-shadow:0 14px 30px rgba(0,0,0,.7),0 0 46px -8px var(--kb)}
.wk-gem img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.wk-gem canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.wk-gcap{position:absolute;left:0;right:0;bottom:0;padding:34px 12px 12px;background:linear-gradient(transparent,rgba(8,4,6,.92) 60%)}.wk-gcap b{display:block;font-family:var(--serif);font-weight:400;font-size:19px;line-height:1.1}
.wk-gem.done .gfx i{animation:gfacet .6s ease-out both}.wk-gem.done .gfx i:nth-child(1){animation-delay:.2s}.wk-gem.done .gfx i:nth-child(2){animation-delay:.33s}.wk-gem.done .gfx i:nth-child(3){animation-delay:.46s}.wk-gem.done .gfx i:nth-child(4){animation-delay:.59s}.wk-gem.done .gfx i:nth-child(5){animation-delay:.72s}
.wk-bub{border-radius:18px;padding:11px 13px;font-size:13.5px;line-height:1.35;max-width:92%;background:rgba(255,255,255,.07);margin-top:10px}.wk-bub.me{background:linear-gradient(135deg,rgba(255,122,77,.25),rgba(255,77,126,.25));margin:0 0 0 auto;max-width:80%}.wk-bub b{display:block;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ka);margin-bottom:2px}
.wk-three{display:flex;gap:6px;margin-top:10px}.wk-three button{flex:1;padding:9px 2px;border-radius:11px;font-size:11.5px;font-weight:700;background:rgba(255,255,255,.08);color:#f6eef1}.wk-three button.on{background:linear-gradient(135deg,var(--ka),var(--kb));color:#1c0a12}
.wk-row{margin-top:8px;padding:9px 12px;border-radius:12px;background:rgba(255,255,255,.06);font-size:13px;animation:wkin .35s both}@keyframes wkin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

.wk-pulse{animation:wkpulse 1.4s infinite}@keyframes wkpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.35)}60%{box-shadow:0 0 0 10px rgba(255,255,255,0)}}
.wk-ban{border-radius:14px;padding:10px 12px;font-size:12.5px;background:rgba(40,36,48,.95);margin-bottom:4px;opacity:0;transform:translateY(-14px);transition:opacity .35s,transform .35s}.wk-ban.in{opacity:1;transform:none}
.wk-gold{position:absolute;left:50%;top:4px;width:160px;height:206px;margin-left:-80px;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,#b8862b,#f6d77a 45%,#a8741d);box-shadow:0 14px 30px rgba(0,0,0,.7)}
.wk-gold .gband{position:absolute;left:0;right:0;top:44%;height:26px;background:linear-gradient(#5a1230,#8a1e48,#5a1230);transition:transform .6s cubic-bezier(.5,0,.2,1) .15s}.wk-bow{position:absolute;left:50%;top:38%;width:60px;height:50px;margin-left:-30px;background:#8a1e48;clip-path:polygon(0 0,50% 40%,100% 0,100% 100%,50% 60%,0 100%);transition:transform .45s,opacity .45s}
.wk-gold.open .wk-bow{transform:scale(.2) rotate(40deg);opacity:0}
.wk-bell{position:absolute;left:50%;top:60px;margin-left:-36px;width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center;box-shadow:0 0 40px -6px var(--kb)}.wk-bell .ic{width:30px;height:30px}

/* walkthrough fixes: even padding in the small boxes, a bow that visibly unties */
.wk-dirs div{padding:9px 2px 8px;line-height:1.25;font-size:11.5px;white-space:nowrap;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:50px}.wk-dirs b{line-height:1;margin-bottom:3px}
.wk-three{display:grid;grid-template-columns:1fr 1fr;gap:6px}.wk-three button{padding:10px 6px;line-height:1.2;min-height:40px;font-size:12.5px;display:flex;align-items:center;justify-content:center;text-align:center}.wk-three button:first-child{grid-column:1/-1}
.wk-bub{padding:12px 14px}.wk-row{padding:10px 13px;line-height:1.3}.wk-ban{padding:10px 13px;line-height:1.3}.wk-step{padding:12px 13px;line-height:1.3}.wk-step .tpill{flex:none;line-height:1.2;padding:8px 14px}

.wk-bow b{position:absolute;left:50%;top:50%;width:20px;height:22px;margin:-11px 0 0 -10px;border-radius:6px;background:linear-gradient(135deg,#d96a82,#7a1830)}
@keyframes wkwig{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-7deg)}80%{transform:rotate(6deg)}90%{transform:rotate(-3deg)}}
.wk-gold.open .wk-bow{animation:none;transform:translate(60px,-90px) rotate(70deg) scale(.5)!important;opacity:0}

.wk-bow.drag{animation:none}
