<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="supported-color-schemes" content="dark">
<title>Sign back in to Let’s Together</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body style="margin:0;padding:0;background-color:#100d12;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">Tap to sign back in.</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#100d12" style="background-color:#100d12;">
<tr><td align="center" style="padding:40px 16px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:440px;">
<tr><td align="center" style="padding:0 0 18px;">
<img src="https://letstogether.app/email-logo.gif" width="300" height="214" alt="Let’s Together" style="display:block;border:0;width:300px;max-width:100%;height:auto;">
</td></tr>
<tr><td align="center" bgcolor="#1b1620" style="background-color:#1b1620;border-radius:24px;padding:36px 28px 32px;">
<p style="margin:0 0 6px;font-family:'Instrument Serif',Georgia,'Times New Roman',serif;font-size:34px;line-height:1.15;color:#ffffff;">Sign back in</p>
<p style="margin:0 0 26px;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;line-height:1.5;color:#c9bec6;">Tap below to get back into your account.</p>
<table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center">
<tr><td align="center" bgcolor="#ff5a6e" style="background-color:#ff5a6e;border-radius:14px;">
<a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:15px 30px;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;font-weight:700;color:#ffffff;text-decoration:none;">Sign in</a>
</td></tr>
</table>
<p style="margin:24px 0 0;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13.5px;line-height:1.5;color:#9a8f97;">If you didn’t ask for this, you can ignore this email.</p>
</td></tr>
<tr><td align="center" style="padding:22px 0 0;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;color:#7d727a;">letstogether.app</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
